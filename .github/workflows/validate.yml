name: Validar Blandskron Documental

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Comprobar montajes JWT, puertos y configuración de servicios
        run: |
          docker compose -f docker/docker-compose.yml config --format json > /tmp/blandskron-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          services = json.loads(Path("/tmp/blandskron-compose.json").read_text())["services"]
          conversation_env = services["conversation-service"]["environment"]
          assert set(conversation_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM", "PGPASSWORD",
          }
          assert json.loads(conversation_env["CORS_ORIGINS"]) == [
              "http://localhost:3000", "http://127.0.0.1:3000",
          ]
          assert conversation_env["DATABASE_URL"] == (
              "postgresql+psycopg://conversation_runtime@postgres:5432/documents_db"
          )
          rag_chat_env = services["rag-document-chat-service"]["environment"]
          assert set(rag_chat_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM", "GROQ_API_KEY", "GROQ_CHAT_MODEL",
              "CHAT_COMPLETION_MAX_TOKENS", "CHAT_COMPLETION_TEMPERATURE", "CHAT_COMPLETION_TIMEOUT_SECONDS",
              "VECTOR_SEARCH_LIMIT", "MIN_SIMILARITY_SCORE", "PGPASSWORD",
          }
          assert json.loads(rag_chat_env["CORS_ORIGINS"]) == [
              "http://localhost:3000", "http://127.0.0.1:3000",
          ]
          assert rag_chat_env["DATABASE_URL"] == "postgresql+psycopg://rag_chat_runtime@postgres:5432/documents_db"
          embedding_env = services["rag-document-embedding-service"]["environment"]
          assert set(embedding_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "DOCUMENT_STORAGE_BASE_PATH", "MAX_CHUNK_SIZE", "CHUNK_OVERLAP",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM", "PGPASSWORD",
          }
          assert json.loads(embedding_env["CORS_ORIGINS"]) == [
              "http://localhost:3000", "http://127.0.0.1:3000",
          ]
          assert embedding_env["DATABASE_URL"] == "postgresql+psycopg://embedding_runtime@postgres:5432/documents_db"
          search = services["document-search-service"]
          assert search["environment"]["DATABASE_URL"] == "postgresql+psycopg://document_search_runtime@postgres:5432/documents_db"
          assert search["depends_on"]["search-db-role"]["condition"] == "service_completed_successfully"
          search_env = search["environment"]
          assert set(search_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM", "PGPASSWORD",
          }
          assert json.loads(search_env["CORS_ORIGINS"]) == [
              "http://localhost:3000", "http://127.0.0.1:3000",
          ]
          access = services["document-access-service"]
          access_env = access["environment"]
          assert access_env["DATABASE_URL"] == "postgresql+psycopg://document_access_runtime@postgres:5432/documents_db"
          assert access["depends_on"]["access-db-role"]["condition"] == "service_completed_successfully"
          assert access["user"] == "10004:10004"
          assert access["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in access["security_opt"]
          assert set(access_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "DOCUMENT_STORAGE_BASE_PATH", "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM", "PGPASSWORD",
          }
          assert json.loads(access_env["CORS_ORIGINS"]) == [
              "http://localhost:3000", "http://127.0.0.1:3000",
          ]
          assert "health/db" in " ".join(access["healthcheck"]["test"])
          library = services["document-library-service"]
          library_env = library["environment"]
          assert set(library_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM",
              "DB_POOL_MIN_SIZE", "DB_POOL_MAX_SIZE", "DB_TIMEOUT_SECONDS",
              "PGPASSWORD",
          }
          assert json.loads(library_env["CORS_ORIGINS"]) == ["http://localhost:3000", "http://127.0.0.1:3000"]
          assert "health/db" in " ".join(library["healthcheck"]["test"])
          assert library_env["DATABASE_URL"] == "postgresql+psycopg://document_library_runtime@postgres:5432/documents_db"
          assert library["depends_on"]["library-db-role"]["condition"] == "service_completed_successfully"
          assert library["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in library["security_opt"]
          transfer = services["document-transfer-service"]
          transfer_env = transfer["environment"]
          assert set(transfer_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM",
              "DB_POOL_MIN_SIZE", "DB_POOL_MAX_SIZE", "DB_TIMEOUT_SECONDS",
              "PGPASSWORD",
          }
          assert json.loads(transfer_env["CORS_ORIGINS"]) == ["http://localhost:3000", "http://127.0.0.1:3000"]
          assert "health/db" in " ".join(transfer["healthcheck"]["test"])
          export = services["document-export-service"]
          assert set(export["environment"]) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL", "PGPASSWORD",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM",
              "DB_POOL_MIN_SIZE", "DB_POOL_MAX_SIZE", "DB_TIMEOUT_SECONDS",
          }
          assert json.loads(export["environment"]["CORS_ORIGINS"]) == ["http://localhost:3000", "http://127.0.0.1:3000"]
          assert "health/db" in " ".join(export["healthcheck"]["test"])
          assert export["environment"]["DATABASE_URL"] == "postgresql+psycopg://export_runtime@postgres:5432/documents_db"
          assert export["depends_on"]["export-db-role"]["condition"] == "service_completed_successfully"
          assert export["read_only"] is True and export["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in export["security_opt"]
          assert all(volume.get("target") != "/app/exports" for volume in export.get("volumes", []))
          drive = services["google-drive-import-service"]
          assert drive["environment"]["DATABASE_URL"] == "postgresql+psycopg://drive_runtime@postgres:5432/documents_db"
          assert drive["environment"]["GOOGLE_DRIVE_ENABLED"] == "false"
          assert drive["read_only"] is True
          assert drive["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in drive["security_opt"]
          assert drive["pids_limit"] == 128
          assert "size=67108864" in drive["tmpfs"][0]
          assert json.loads(drive["environment"]["CORS_ORIGINS"]) == ["http://localhost:3000", "http://127.0.0.1:3000"]
          assert drive["depends_on"]["drive-db-role"]["condition"] == "service_completed_successfully"
          assert "health/db" in " ".join(drive["healthcheck"]["test"])
          assert "GROQ_API_KEY" not in drive["environment"]
          assert "DJANGO_SECRET_KEY" not in drive["environment"]
          profile = services["profile-service"]
          profile_env = profile["environment"]
          assert set(profile_env) == {
              "APP_ENV", "APP_NAME", "LOG_LEVEL", "CORS_ORIGINS", "DATABASE_URL", "PGPASSWORD",
              "AUTH_JWT_PUBLIC_KEY_PATH", "AUTH_JWT_ALGORITHM",
              "DB_POOL_MIN_SIZE", "DB_POOL_MAX_SIZE", "DB_TIMEOUT_SECONDS",
          }
          assert json.loads(profile_env["CORS_ORIGINS"]) == ["http://localhost:3000", "http://127.0.0.1:3000"]
          assert "health/db" in " ".join(profile["healthcheck"]["test"])
          assert profile["read_only"] is True
          assert profile_env["DATABASE_URL"] == "postgresql+psycopg://profile_runtime@postgres:5432/documents_db"
          assert profile["depends_on"]["profile-db-role"]["condition"] == "service_completed_successfully"
          assert services["profile-db-role"]["depends_on"]["auth-service"]["condition"] == "service_healthy"
          assert len(profile["volumes"]) == 1 and profile["volumes"][0]["source"] == "auth_verification_keys"
          assert profile["cap_drop"] == ["ALL"]
          assert transfer_env["DATABASE_URL"] == "postgresql+psycopg://document_transfer_runtime@postgres:5432/documents_db"
          assert transfer["depends_on"]["transfer-db-role"]["condition"] == "service_completed_successfully"
          assert transfer["cap_drop"] == ["ALL"]
          assert "no-new-privileges:true" in transfer["security_opt"]
          for name, service in services.items():
              mounts = {volume["source"]: volume for volume in service.get("volumes", [])}
              assert all(port.get("host_ip") == "127.0.0.1" for port in service.get("ports", [])), name
              if name == "auth-service":
                  assert {"auth_signing_keys", "auth_verification_keys"} <= mounts.keys()
                  continue
              assert "auth_signing_keys" not in mounts and "auth_keys" not in mounts, name
              if service.get("environment", {}).get("AUTH_JWT_PUBLIC_KEY_PATH") == "/app/auth_keys/public.pem":
                  assert mounts["auth_verification_keys"]["read_only"], name
          PY

  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/AuthServices
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: test
      POSTGRES_DB: documents_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: documents_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d documents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/AuthServices/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --file /tmp/auth-openapi.yaml
      - run: python manage.py test users core --noinput
      - name: Verificar el usuario de la imagen Auth
        run: |
          docker build -t blandskron-auth-ci .
          docker run --rm --network none blandskron-auth-ci python -c 'import os; assert os.geteuid() == 10001'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: documents_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d documents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar la migración y su segundo arranque
        run: |
          docker cp scripts/database/migrations/001_local_embeddings.sql "${{ job.services.postgres.id }}:/tmp/blandskron-local-embeddings.sql"
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d documents_test -v ON_ERROR_STOP=1 < scripts/database/tests/local_embeddings.sql

  rag-groq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/RagDocumentChatServices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/RagDocumentChatServices/requirements.txt
      - name: Probar el contrato de Groq con transporte HTTP simulado
        run: |
          python -m pip install -r <(grep -hE '^(openai|pytest)==' requirements.txt requirements-test.txt)
          python -m pytest -q tests/test_groq_provider.py

  auth-db-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker/docker-compose.yml up -d --build --wait conversation-service document-search-service document-access-service document-library-service document-transfer-service profile-service document-export-service google-drive-import-service
      - run: docker compose -f docker/docker-compose.yml run --rm --no-deps rag-chat-db-role
      - run: docker compose -f docker/docker-compose.yml run --rm --no-deps embedding-db-role
      - run: docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/auth/verify_roles.sql
      - name: Validar preflight multiempresa sin modificar históricos
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d documents_db -X -q -v ON_ERROR_STOP=1 -f /schema/tests/tenant_preflight.sql
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d documents_db -X -q -v ON_ERROR_STOP=1 -f /schema/checks/tenant_preflight.sql

      - name: Probar restricciones de asignaciones con logins y carreras reales
        run: |
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 -c 'CREATE DATABASE plat_assignments_ci'
          trap 'docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 -c "DROP DATABASE plat_assignments_ci WITH (FORCE)"' EXIT
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_assignments_ci -v ON_ERROR_STOP=1 -f /schema/run_all.sql
          docker compose -f docker/docker-compose.yml cp scripts/database/constraints/002_tenant_assignments.sql auth-service:/tmp/tenant-assignments.sql
          docker compose -f docker/docker-compose.yml cp scripts/database/tests/test_tenant_assignments.py auth-service:/tmp/test_tenant_assignments.py
          docker compose -f docker/docker-compose.yml exec -T -e PLAT_TEST_DATABASE=plat_assignments_ci -e PLAT_TEST_ADMIN_PASSWORD=admin1234 auth-service python /tmp/test_tenant_assignments.py
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_assignments_ci -v ON_ERROR_STOP=1 -f /schema/run_all.sql
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_assignments_ci -v ON_ERROR_STOP=1 -f /schema/migrations/003_tenant_assignments.sql

      - name: Probar relaciones de áreas, documentos y conflictos HTTP
        run: |
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 -c 'CREATE DATABASE plat_relations_ci'
          trap 'docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 -c "DROP DATABASE plat_relations_ci WITH (FORCE)"' EXIT
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_relations_ci -v ON_ERROR_STOP=1 -f /schema/run_all.sql
          docker compose -f docker/docker-compose.yml run --rm --no-deps -e EMBEDDING_DB_PASSWORD=blandskron-local-embedding database-schema psql -h postgres -U postgres -d plat_relations_ci -v ON_ERROR_STOP=1 -f /schema/embedding/provision_role.sql
          docker compose -f docker/docker-compose.yml cp scripts/database/constraints/002_tenant_assignments.sql auth-service:/tmp/tenant-assignments.sql
          docker compose -f docker/docker-compose.yml cp scripts/database/constraints/003_tenant_area_relations.sql auth-service:/tmp/tenant-areas.sql
          docker compose -f docker/docker-compose.yml cp scripts/database/tests/test_tenant_area_relations.py auth-service:/tmp/test_tenant_area_relations.py
          docker compose -f docker/docker-compose.yml exec -T -e POSTGRES_DB=plat_relations_ci -e PLAT_TEST_DATABASE=plat_relations_ci -e PLAT_TEST_ADMIN_PASSWORD=admin1234 auth-service python /tmp/test_tenant_area_relations.py
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps --volume "$PWD/scripts/database/tests:/relation-checks:ro" -e PLAT_TEST_DATABASE=plat_relations_ci -e PLAT_TEST_ADMIN_PASSWORD=admin1234 -e PLAT_TEST_AUTH_PASSWORD=blandskron-local-runtime embedding-tests python /relation-checks/test_embedding_area_relations.py
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_relations_ci -v ON_ERROR_STOP=1 -f /schema/run_all.sql
          docker compose -f docker/docker-compose.yml run --rm --no-deps database-schema psql -h postgres -U postgres -d plat_relations_ci -v ON_ERROR_STOP=1 -f /schema/migrations/004_tenant_area_relations.sql

      - run: docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/conversation/verify_role.sql
      - run: docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/rag-chat/verify_role.sql
      - run: docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/embedding/verify_role.sql
      - run: docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/search/verify_role.sql
      - name: Comprobar permisos e idempotencia de DocumentAccessServices
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps access-db-role
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/access/verify_role.sql
          docker compose -f docker/docker-compose.yml exec -T document-access-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T document-access-service python -c 'import os, importlib.util; assert os.geteuid() == 10004; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx"))'
      - name: Comprobar imagen de ConversationServices
        run: |
          docker compose -f docker/docker-compose.yml exec -T conversation-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T conversation-service python -c 'import os; assert os.geteuid() == 10002'
      - name: Probar JWT, aislamiento y vínculos contra PostgreSQL
        run: |
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps conversation-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps conversation-tests ruff check --no-cache app tests
      - name: Validar imagen y contrato de DocumentSearchServices
        run: |
          docker compose -f docker/docker-compose.yml exec -T document-search-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T document-search-service python -c 'import os, importlib.util; assert os.geteuid() == 10005; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx"))'
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps search-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps search-tests ruff check --no-cache app tests
      - name: Probar identidad y permisos de DocumentAccessServices
        run: |
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps access-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps access-tests ruff check --no-cache app tests
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps access-audit
      - name: Probar configuración, arranque y acceso HTTP de DocumentLibraryServices
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps library-db-role
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/library/verify_role.sql
          docker compose -f docker/docker-compose.yml exec -T document-library-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T document-library-service python -c 'import os, importlib.util; assert os.geteuid() == 10006; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx", "pip_audit"))'
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps library-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps library-tests ruff check --no-cache app tests
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps library-audit
      - name: Probar configuración y disponibilidad de DocumentTransferServices
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps transfer-db-role
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/transfer/verify_role.sql
          docker compose -f docker/docker-compose.yml exec -T document-transfer-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T document-transfer-service python -c 'import os, importlib.util; assert os.geteuid() == 10007; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx", "pip_audit"))'
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/transfer/audit_owners.sql
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps transfer-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps transfer-tests ruff check --no-cache app tests
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps transfer-audit
          docker compose -f docker/docker-compose.yml restart document-transfer-service
          docker compose -f docker/docker-compose.yml up -d --no-deps --wait document-transfer-service
      - name: Probar configuración, disponibilidad y contrato base de ProfileServices
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps profile-db-role
          docker compose -f docker/docker-compose.yml run --rm --no-deps profile-db-role
          docker compose -f docker/docker-compose.yml exec -T profile-service python -m pip --no-cache-dir check
          docker compose -f docker/docker-compose.yml exec -T profile-service python -c 'import importlib.util, os; assert os.geteuid() == 10008; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx", "pip_audit"))'
          docker compose -f docker/docker-compose.yml exec -T profile-service python -c 'import subprocess; version=subprocess.check_output(["dpkg-query","-W","-f=${Version}","zlib1g"],text=True); subprocess.check_call(["dpkg","--compare-versions",version,"ge","1:1.3.dfsg+really1.3.1-1+deb13u1"])'
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps profile-tests
          docker compose -f docker/docker-compose.yml run --rm --no-deps profile-tests ruff check --no-cache app tests /profile-checks
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps profile-audit
          docker compose -f docker/docker-compose.yml restart profile-service
          docker compose -f docker/docker-compose.yml up -d --no-deps --wait profile-service
          docker compose -f docker/docker-compose.yml cp scripts/profile/verify_auth_contract.py auth-service:/tmp/profile-auth-contract.py
          marker=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          cleanup_profile_probe() {
            docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 -v probe_marker="$marker" < scripts/profile/cleanup_probe.sql
