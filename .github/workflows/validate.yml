          docker compose -f docker/docker-compose.yml exec -T -e PROFILE_PROBE_MARKER="$marker" auth-service python /tmp/profile-auth-contract.py
      - name: Probar configuración, persistencia y disponibilidad de DocumentExportServices
        run: |
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/export/audit_owners.sql
          docker compose -f docker/docker-compose.yml run --rm --no-deps export-db-role
          docker compose -f docker/docker-compose.yml run --rm --no-deps export-db-role
          docker compose -f docker/docker-compose.yml exec -T postgres psql -U postgres -d documents_db -v ON_ERROR_STOP=1 < scripts/database/export/verify_role.sql
          docker compose -f docker/docker-compose.yml exec -T document-export-service python -c 'import importlib.util, os; assert os.geteuid() == 10009; assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "httpx", "pypdf", "pip_audit", "pip"))'
          docker compose -f docker/docker-compose.yml run --build --rm --no-deps export-tests
