name: Release (CD)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag semántico existente en main a publicar (ej. v0.2.0)'
        required: true
        type: string
      draft:
        description: 'Publicar como borrador (draft)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-origin:
    name: Validar tag y procedencia en main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verificar que el tag apunta a un commit integrado en main
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            draft="$INPUT_DRAFT"
          else
            tag="$REF_NAME"
            draft="false"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag inválido: $tag. Usa formato semántico vX.Y.Z." >&2
            exit 1
          fi

          git fetch origin main --tags --quiet
          commit_sha=$(git rev-parse "${tag}^{commit}")
          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "Bloqueado: el commit $commit_sha del tag $tag NO pertenece a origin/main." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Tag $tag verificado sobre commit $commit_sha en origin/main."

  integration-verification:
    name: Verificación integral previa a publicación
    needs: [verify-release-origin]
    uses: ./.github/workflows/ci-integration.yml

  publish-release:
    name: Publicar GitHub Release
    needs: [verify-release-origin, integration-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-origin.outputs.tag }}
      - name: Descargar reportes verificados de integración
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-verification
          path: release-bundle
      - name: Generar checksums SHA-256 de la evidencia de entrega
        run: |
          cd release-bundle
          sha256sum *.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-origin.outputs.tag }}
          RELEASE_DRAFT: ${{ needs.verify-release-origin.outputs.draft }}
        run: |
          args=(--title "Blandskron Documental $RELEASE_TAG" --generate-notes)
          if [ "$RELEASE_DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-bundle/* --clobber
          else
            gh release create "$RELEASE_TAG" release-bundle/* "${args[@]}"
          fi

