name: Capturas reales (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-screenshots:
    name: Generar capturas reales con Docker Compose y Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar cwebp y dependencias Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y webp
          cd frontend && npm ci && npx playwright install chromium
      - name: Levantar stack real y capturar pantallas sintéticas
        run: |
          docker compose up -d --build --wait
          trap 'docker compose down --remove-orphans' EXIT
          node scripts/screenshots/capture_screenshots.mjs --base-url http://localhost:3000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blandskron-screenshots
          path: |
            docs/assets/screenshots/
            .release-reports/SCREENSHOTS_REPORT.json
          if-no-files-found: ignore
          retention-days: 14
