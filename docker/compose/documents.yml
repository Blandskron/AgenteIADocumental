services:
  rag-chat-db-role:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      RAG_CHAT_DB_PASSWORD: ${RAG_CHAT_DB_PASSWORD:-blandskron-local-rag-chat}
    volumes:
      - ../../scripts/database/rag-chat:/rag-chat-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/rag-chat-db/provision_role.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully

  rag-document-chat-service:
    build:
      context: ../../backend/RagDocumentChatServices
      dockerfile: Dockerfile
    container_name: rag-document-chat-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: rag-document-chat-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${RAG_CHAT_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://rag_chat_runtime@postgres:5432/documents_db
      PGPASSWORD: ${RAG_CHAT_DB_PASSWORD:-blandskron-local-rag-chat}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-20b}
      CHAT_COMPLETION_MAX_TOKENS: ${CHAT_COMPLETION_MAX_TOKENS:-2000}
      CHAT_COMPLETION_TEMPERATURE: ${CHAT_COMPLETION_TEMPERATURE:-0.3}
      CHAT_COMPLETION_TIMEOUT_SECONDS: ${CHAT_COMPLETION_TIMEOUT_SECONDS:-60}
      VECTOR_SEARCH_LIMIT: ${VECTOR_SEARCH_LIMIT:-5}
      MIN_SIMILARITY_SCORE: ${MIN_SIMILARITY_SCORE:-0.0}
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -r /app/auth_keys/public.pem && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      rag-chat-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  rag-chat-tests:
    profiles: ["test"]
    build:
      context: ../../backend/RagDocumentChatServices
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://rag_chat_runtime@postgres:5432/documents_db
      PGPASSWORD: ${RAG_CHAT_DB_PASSWORD:-blandskron-local-rag-chat}
      RAG_CHAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
    depends_on:
      rag-document-chat-service:
        condition: service_healthy

  embedding-db-role:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      EMBEDDING_DB_PASSWORD: ${EMBEDDING_DB_PASSWORD:-blandskron-local-embedding}
    volumes:
      - ../../scripts/database/embedding:/embedding-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/embedding-db/provision_role.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully

  rag-document-embedding-service:
    build:
      context: ../../backend/RagDocumentEmbeddingServices
      dockerfile: Dockerfile
    container_name: rag-document-embedding-service
    user: "${EMBEDDING_UID:-10004}:${EMBEDDING_GID:-10004}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: rag-document-embedding-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${EMBEDDING_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://embedding_runtime@postgres:5432/documents_db
      PGPASSWORD: ${EMBEDDING_DB_PASSWORD:-blandskron-local-embedding}
      DOCUMENT_STORAGE_BASE_PATH: /app/documents
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-160}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ../../documents:/app/documents
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -w /app/documents && test -r /app/auth_keys/public.pem && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      embedding-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  embedding-tests:
    profiles: ["test"]
    build:
      context: ../../backend/RagDocumentEmbeddingServices
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://embedding_runtime@postgres:5432/documents_db
      PGPASSWORD: ${EMBEDDING_DB_PASSWORD:-blandskron-local-embedding}
      EMBEDDING_TEST_DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
    depends_on:
      rag-document-embedding-service:
        condition: service_healthy

  search-db-role:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:-blandskron-local-search}
    volumes:
      - ../../scripts/database/search:/search-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/search-db/provision_role.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully

  document-search-service:
    build:
      context: ../../backend/DocumentSearchServices
      dockerfile: Dockerfile
    container_name: document-search-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: document-search-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${SEARCH_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://document_search_runtime@postgres:5432/documents_db
      PGPASSWORD: ${SEARCH_DB_PASSWORD:-blandskron-local-search}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -r /app/auth_keys/public.pem && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      search-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  search-tests:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentSearchServices
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://document_search_runtime@postgres:5432/documents_db
      PGPASSWORD: ${SEARCH_DB_PASSWORD:-blandskron-local-search}
      SEARCH_TEST_DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
    depends_on:
      document-search-service:
        condition: service_healthy

  document-access-service:
    build:
      context: ../../backend/DocumentAccessServices
      dockerfile: Dockerfile
    container_name: document-access-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: document-access-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${ACCESS_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      DOCUMENT_STORAGE_BASE_PATH: /app/documents
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - ../../documents:/app/documents
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -d /app/documents && test -r /app/auth_keys/public.pem && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  access-tests:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentAccessServices
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
    depends_on:
      document-access-service:
        condition: service_healthy

  document-library-service:
    build:
      context: ../../backend/DocumentLibraryServices
      dockerfile: Dockerfile
    container_name: document-library-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: document-library-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  document-transfer-service:
    build:
      context: ../../backend/DocumentTransferServices
      dockerfile: Dockerfile
    container_name: document-transfer-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: document-transfer-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8007:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  document-export-service:
    build:
      context: ../../backend/DocumentExportServices
      dockerfile: Dockerfile
    container_name: document-export-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: document-export-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      EXPORT_STORAGE_BASE_PATH: /app/exports
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8016:8000"
    volumes:
      - ../../documents/exports:/app/exports
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  google-drive-import-service:
    build:
      context: ../../backend/GoogleDriveImportServices
      dockerfile: Dockerfile
    container_name: google-drive-import-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: google-drive-import-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      RAG_DOCUMENT_BASE_URL: http://rag-document-embedding-service:8000
      GOOGLE_DRIVE_REDIRECT_URI: http://localhost:3000/documents
      GOOGLE_OAUTH_SCOPES: https://www.googleapis.com/auth/drive.file
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8017:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      rag-document-embedding-service:
        condition: service_healthy
