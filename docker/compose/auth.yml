services:
  auth-db-roles:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      AUTH_DB_RUNTIME_PASSWORD: ${AUTH_DB_RUNTIME_PASSWORD:-blandskron-local-runtime}
      AUTH_DB_MIGRATE_PASSWORD: ${AUTH_DB_MIGRATE_PASSWORD:-blandskron-local-migrate}
    volumes:
      - ../../scripts/database/auth:/auth-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/auth-db/provision_roles.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully

  auth-migrate:
    build:
      context: ../../backend/AuthServices
      dockerfile: Dockerfile
    env_file:
      - ../../backend/AuthServices/.env.example
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: documents_db
      POSTGRES_USER: auth_migrate
      POSTGRES_PASSWORD: ${AUTH_DB_MIGRATE_PASSWORD:-blandskron-local-migrate}
      DJANGO_PRIVATE_KEY_PATH: /tmp/auth-migrate/private.pem
      DJANGO_PUBLIC_KEY_PATH: /tmp/auth-migrate/public.pem
    user: "10001:10001"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py grant_auth_runtime"]
    depends_on:
      auth-db-roles:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ../../backend/AuthServices
      dockerfile: Dockerfile
    container_name: blandskron-auth-service
    env_file:
      - ../../backend/AuthServices/.env.example
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: documents_db
      POSTGRES_USER: auth_runtime
      POSTGRES_PASSWORD: ${AUTH_DB_RUNTIME_PASSWORD:-blandskron-local-runtime}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,auth-service
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DJANGO_PRIVATE_KEY_PATH: /app/signing_keys/private.pem
      DJANGO_PUBLIC_KEY_PATH: /app/verification_keys/public.pem
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - auth_signing_keys:/app/signing_keys
      - auth_verification_keys:/app/verification_keys
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /app/signing_keys/private.pem && test -s /app/verification_keys/public.pem && python -c 'import socket; socket.create_connection((\"127.0.0.1\", 8001), timeout=2).close()'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
