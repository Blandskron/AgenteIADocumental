services:
  auth-service:
    build:
      context: ../../backend/AuthServices
      dockerfile: Dockerfile
    container_name: blandskron-auth-service
    env_file:
      - ../../backend/AuthServices/.env.example
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: documents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,auth-service
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DJANGO_PRIVATE_KEY_PATH: /app/keys/private.pem
      DJANGO_PUBLIC_KEY_PATH: /app/keys/public.pem
    ports:
      - "8001:8001"
    volumes:
      - auth_keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/keys/public.pem"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      database-schema:
        condition: service_completed_successfully
