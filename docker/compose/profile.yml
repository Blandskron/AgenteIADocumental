services:
  profile-db-role:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:-blandskron-local-profile}
    volumes:
      - ../../scripts/database/profile:/profile-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/profile-db/provision_role.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  profile-service:
    build:
      context: ../../backend/ProfileServices
      dockerfile: Dockerfile
    container_name: profile-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: profile-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${PROFILE_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://profile_runtime@postgres:5432/documents_db
      PGPASSWORD: ${PROFILE_DB_PASSWORD:-blandskron-local-profile}
      DB_POOL_MIN_SIZE: ${PROFILE_DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${PROFILE_DB_POOL_MAX_SIZE:-10}
      DB_TIMEOUT_SECONDS: ${PROFILE_DB_TIMEOUT_SECONDS:-30}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8015:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    read_only: true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      profile-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  profile-tests:
    profiles: ["test"]
    build:
      context: ../../backend/ProfileServices
      target: test
    environment:
      PROFILE_TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/documents_db
      PROFILE_TEST_RUNTIME_PASSWORD: ${PROFILE_DB_PASSWORD:-blandskron-local-profile}
      PGPASSWORD: admin1234
    volumes:
      - ../../scripts/profile:/profile-checks:ro
      - ../../scripts/database/profile:/profile-db:ro
    depends_on:
      profile-db-role:
        condition: service_completed_successfully

  profile-audit:
    profiles: ["test"]
    build:
      context: ../../backend/ProfileServices
      target: audit

  profile-avatar-tools:
    profiles: ["maintenance"]
    build:
      context: ../../backend/ProfileServices
      target: runtime
    environment:
      PROFILE_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/documents_db
      PGPASSWORD: admin1234
    volumes:
      - ../../uploads/profile:/legacy-avatars:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "app.maintenance.avatars", "inventory", "--legacy-dir", "/legacy-avatars"]
