services:
  profile-service:
    build:
      context: ../../backend/ProfileServices
      dockerfile: Dockerfile
    container_name: profile-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: profile-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
      PROFILE_UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:8015:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
      - ../../uploads/profile:/app/uploads

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
