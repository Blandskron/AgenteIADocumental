services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-documents-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: documents_db
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documents_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  database-schema:
    image: pgvector/pgvector:pg16
    container_name: rag-documents-database-schema
    environment:
      PGPASSWORD: admin1234
    volumes:
      - ../../scripts/database:/schema:ro
    command:
      [
        "sh",
        "-c",
        "psql -h postgres -U postgres -d documents_db -v ON_ERROR_STOP=1 -f /schema/run_all.sql",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: rag-documents-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      database-schema:
        condition: service_completed_successfully

volumes:
  postgres_data:
  pgadmin_data:
  auth_signing_keys:
  auth_verification_keys:
