services:
  postgres:
    build:
      context: ../postgres
    container_name: rag-documents-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: documents_db
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --locale-provider=icu --icu-locale=en-US
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "documents_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  database-schema:
    image: ${COMPOSE_PROJECT_NAME}-postgres
    pull_policy: never
    container_name: rag-documents-database-schema
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ../../scripts/database:/schema:ro
    command:
      [
        "sh",
        "-c",
        "psql -h postgres -U postgres -d documents_db -v ON_ERROR_STOP=1 -f /schema/run_all.sql",
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_postgres_data}
  auth_signing_keys:
  auth_verification_keys:
