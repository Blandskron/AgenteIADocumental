# Optional Docker Compose overlay for AgentOrchestratorServices (AG-004).
# Base `docker compose up -d --build` remains 100% unaffected unless `--profile agents` is enabled.
# Usage:
#   AGENTS_ENABLED=true docker compose -f compose.yaml -f docker/compose/studio.yml -f docker/compose/agents.yml --profile studio --profile agents up -d --build

services:
  agent-db-role:
    image: ${COMPOSE_PROJECT_NAME}-postgres
    pull_policy: never
    profiles: ["agents"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-blandskron-local-agent}
    volumes:
      - ../../scripts/database/agents:/agents-db:ro
      - runtime_secrets:/run/blandskron-secrets:ro
    command:
      [
        "sh",
        "-c",
        "export PGPASSWORD=\"$${PGPASSWORD:-$$(cat /run/blandskron-secrets/postgres_password)}\" && exec psql -h postgres -U postgres -d documents_db -v ON_ERROR_STOP=1 -f /agents-db/provision_role.sql",
      ]
    depends_on:
      database-schema:
        condition: service_completed_successfully

  agent-orchestrator-service:
    build:
      context: ../../backend/AgentOrchestratorServices
      dockerfile: Dockerfile
    profiles: ["agents"]
    container_name: agent-orchestrator-service
    environment:
      AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
      CODE_MODE_ENABLED: ${CODE_MODE_ENABLED:-false}
      CORS_ORIGINS: '${AGENTS_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://agent_runtime@postgres:5432/documents_db
      PGPASSWORD: ${AGENT_DB_PASSWORD:-blandskron-local-agent}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
      AUTH_IDENTITY_URL: http://auth-service:8000/api/users/me/
      MCP_BASE_URL: http://knowledge-studio-service:8000/api/v1/mcp
      KNOWLEDGE_STUDIO_BASE_URL: http://knowledge-studio-service:8000
      DOCUMENT_SEARCH_BASE_URL: http://document-search-service:8000
      DOCUMENT_ACCESS_BASE_URL: http://document-access-service:8000
      DOCUMENT_EXPORT_BASE_URL: http://document-export-service:8000
      LANGGRAPH_STRICT_MSGPACK: "true"
      AGENT_DAILY_TOKEN_QUOTA: ${AGENT_DAILY_TOKEN_QUOTA:-200000}
      AGENT_DAILY_RUN_QUOTA: ${AGENT_DAILY_RUN_QUOTA:-200}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_KEY_ID: ${SECRETS_KEY_ID:-v1}
    ports:
      - "127.0.0.1:8019:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
      - runtime_secrets:/run/blandskron-secrets:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216
    depends_on:
      agent-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

