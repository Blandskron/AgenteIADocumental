services:
  document-export-service:
    build:
      context: ../../backend/DocumentExportServices
      dockerfile: Dockerfile
    container_name: document-export-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: document-export-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${EXPORT_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/documents_db
      PGPASSWORD: admin1234
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
      DB_POOL_MIN_SIZE: ${EXPORT_DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${EXPORT_DB_POOL_MAX_SIZE:-10}
      DB_TIMEOUT_SECONDS: ${EXPORT_DB_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8016:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  export-tests:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentExportServices
      target: test
    environment:
      EXPORT_TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/documents_db
      PGPASSWORD: admin1234
    volumes:
      - ../../scripts/export:/export-checks:ro
      - ../../scripts/database/export:/export-db:ro
    depends_on:
      database-schema:
        condition: service_completed_successfully

  export-audit:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentExportServices
      target: audit
