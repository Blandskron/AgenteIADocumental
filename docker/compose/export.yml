services:
  export-db-role:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: admin1234
      EXPORT_DB_PASSWORD: ${EXPORT_DB_PASSWORD:-blandskron-local-export}
    volumes:
      - ../../scripts/database/export:/export-db:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "documents_db", "-v", "ON_ERROR_STOP=1", "-f", "/export-db/provision_role.sql"]
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
  document-export-service:
    build:
      context: ../../backend/DocumentExportServices
      dockerfile: Dockerfile
    container_name: document-export-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: document-export-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${EXPORT_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      DATABASE_URL: postgresql+psycopg://export_runtime@postgres:5432/documents_db
      PGPASSWORD: ${EXPORT_DB_PASSWORD:-blandskron-local-export}
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
      DB_POOL_MIN_SIZE: ${EXPORT_DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${EXPORT_DB_POOL_MAX_SIZE:-10}
      DB_TIMEOUT_SECONDS: ${EXPORT_DB_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8016:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    read_only: true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 96
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      export-db-role:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

  export-tests:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentExportServices
      target: test
    environment:
      EXPORT_TEST_RUNTIME_PASSWORD: ${EXPORT_DB_PASSWORD:-blandskron-local-export}
      EXPORT_TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/documents_db
      PGPASSWORD: admin1234
    volumes:
      - ../../scripts/export:/export-checks:ro
      - ../../scripts/database/export:/export-db:ro
    depends_on:
      export-db-role:
        condition: service_completed_successfully

  export-audit:
    profiles: ["test"]
    build:
      context: ../../backend/DocumentExportServices
      target: audit
    volumes:
      - ../../scripts/export:/export-checks:ro
