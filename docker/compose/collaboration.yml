services:
  conversation-service:
    build:
      context: ../../backend/ConversationServices
      dockerfile: Dockerfile
    container_name: conversation-service
    env_file:
      - ../../.env
    environment:
      APP_NAME: conversation-service
      CORS_ORIGINS: '["*"]'
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/documents_db
      AUTH_JWT_PUBLIC_KEY_PATH: /app/auth_keys/public.pem
      AUTH_JWT_ALGORITHM: RS256
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - auth_verification_keys:/app/auth_keys:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      database-schema:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
